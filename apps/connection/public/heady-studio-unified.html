<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeadyStudio - Unified Creative Ecosystem</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>
    <style>
        body { background: #0f172a; color: white; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; overflow: hidden; }
        .glass-morphism { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(10px); border: 1px solid rgba(148, 163, 184, 0.1); }
        .neon-glow { box-shadow: 0 0 20px rgba(6, 182, 212, 0.3), 0 0 40px rgba(6, 182, 212, 0.1); }
        .module-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .module-card:hover { transform: translateY(-4px) scale(1.02); }
        .active-module { background: linear-gradient(135deg, rgba(6, 182, 212, 0.2), rgba(139, 92, 246, 0.2)); border-color: rgb(6, 182, 212); }
        .pulse-animation { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .slide-in { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(30, 41, 59, 0.3); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.5); }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback, useRef } = React;
        const { 
            Layers, Music, BookOpen, Code, Palette, Settings, Activity, Terminal, 
            Github, Play, Pause, SkipForward, Volume2, Mic, Video, Image, FileText,
            Zap, Users, Cloud, Database, Shield, Globe, Smartphone, Monitor, Headphones,
            Edit3, Save, Share2, Download, Upload, Search, Bell, User, LogOut, Menu,
            X, ChevronRight, ChevronLeft, Plus, Trash2, Copy, Move, Maximize2, Grid3x3
        } = lucide;

        // Unified State Management
        const useHeadyState = () => {
            const [activeModule, setActiveModule] = useState('studio');
            const [user, setUser] = useState({ name: 'Heady Creator', avatar: '👨‍🎨', role: 'Master Creator' });
            const [notifications, setNotifications] = useState([]);
            const [globalSearch, setGlobalSearch] = useState('');
            const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
            const [projects, setProjects] = useState([
                { id: 1, name: 'Symphony No.5', type: 'music', modified: '2 hours ago', status: 'active' },
                { id: 2, name: 'Digital Art Collection', type: 'studio', modified: '1 day ago', status: 'completed' },
                { id: 3, name: 'Interactive Learning Module', type: 'education', modified: '3 days ago', status: 'in-progress' },
                { id: 4, name: 'Code Repository', type: 'development', modified: '1 week ago', status: 'archived' }
            ]);
            const [recentActivity, setRecentActivity] = useState([
                { id: 1, action: 'Edited', project: 'Symphony No.5', time: '5 min ago', icon: Edit3 },
                { id: 2, action: 'Shared', project: 'Digital Art Collection', time: '1 hour ago', icon: Share2 },
                { id: 3, action: 'Created', project: 'New Track', time: '2 hours ago', icon: Plus },
                { id: 4, action: 'Completed', project: 'Learning Module', time: '3 hours ago', icon: Save }
            ]);

            return {
                activeModule, setActiveModule,
                user, setUser,
                notifications, setNotifications,
                globalSearch, setGlobalSearch,
                sidebarCollapsed, setSidebarCollapsed,
                projects, setProjects,
                recentActivity, setRecentActivity
            };
        };

        // Module Definitions
        const modules = {
            studio: {
                id: 'studio',
                name: 'HeadyStudio',
                icon: Palette,
                color: 'from-purple-500 to-pink-500',
                description: 'Digital art & design workspace',
                features: ['Canvas Editor', '3D Modeling', 'Animation', 'Collaboration']
            },
            music: {
                id: 'music',
                name: 'HeadyMusic',
                icon: Music,
                color: 'from-green-500 to-teal-500',
                description: 'Music production & audio editing',
                features: ['Multi-track Editor', 'Virtual Instruments', 'Effects', 'Mixing Console']
            },
            education: {
                id: 'education',
                name: 'HeadyEd',
                icon: BookOpen,
                color: 'from-blue-500 to-indigo-500',
                description: 'Interactive learning platform',
                features: ['Course Builder', 'Assessments', 'Analytics', 'Student Portal']
            },
            development: {
                id: 'development',
                name: 'HeadyDev',
                icon: Code,
                color: 'from-orange-500 to-red-500',
                description: 'Code development & deployment',
                features: ['IDE Integration', 'Git Management', 'CI/CD', 'Code Review']
            },
            cloud: {
                id: 'cloud',
                name: 'HeadyCloud',
                icon: Cloud,
                color: 'from-cyan-500 to-blue-500',
                description: 'Cloud storage & services',
                features: ['File Storage', 'API Gateway', 'Microservices', 'Monitoring']
            }
        };

        // Studio Module Component
        const HeadyStudio = ({ projects, onProjectSelect }) => {
            const [canvas, setCanvas] = useState(null);
            const [tools, setTools] = useState(['brush', 'eraser', 'shape', 'text']);
            const [activeTool, setActiveTool] = useState('brush');

            return (
                <div className="h-full flex flex-col fade-in">
                    <div className="glass-morphism p-4 border-b border-slate-700">
                        <div className="flex items-center justify-between">
                            <div className="flex items-center gap-4">
                                <h2 className="text-xl font-bold bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent">Creative Canvas</h2>
                                <div className="flex gap-2">
                                    {tools.map(tool => (
                                        <button
                                            key={tool}
                                            onClick={() => setActiveTool(tool)}
                                            className={`px-3 py-1 rounded text-xs font-bold transition-all ${
                                                activeTool === tool 
                                                    ? 'bg-purple-600 text-white' 
                                                    : 'bg-slate-700 text-slate-300 hover:bg-slate-600'
                                            }`}
                                        >
                                            {tool.toUpperCase()}
                                        </button>
                                    ))}
                                </div>
                            </div>
                            <div className="flex items-center gap-2">
                                <button className="p-2 bg-slate-700 rounded hover:bg-slate-600 transition-colors">
                                    <Save size={16} />
                                </button>
                                <button className="p-2 bg-slate-700 rounded hover:bg-slate-600 transition-colors">
                                    <Share2 size={16} />
                                </button>
                                <button className="p-2 bg-slate-700 rounded hover:bg-slate-600 transition-colors">
                                    <Download size={16} />
                                </button>
                            </div>
                        </div>
                    </div>
                    <div className="flex-1 p-4">
                        <div className="grid grid-cols-4 gap-4 h-full">
                            <div className="col-span-3 glass-morphism rounded-lg p-4 flex items-center justify-center">
                                <div className="text-center">
                                    <Palette size={48} className="mx-auto mb-4 text-purple-400" />
                                    <h3 className="text-lg font-semibold mb-2">Canvas Workspace</h3>
                                    <p className="text-slate-400 text-sm">Interactive design canvas with advanced tools</p>
                                    <div className="mt-4 flex gap-2 justify-center">
                                        <button className="px-4 py-2 bg-purple-600 rounded text-xs font-bold hover:bg-purple-700 transition-colors">
                                            New Canvas
                                        </button>
                                        <button className="px-4 py-2 bg-slate-700 rounded text-xs font-bold hover:bg-slate-600 transition-colors">
                                            Import Project
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <div className="glass-morphism rounded-lg p-4 overflow-y-auto custom-scrollbar">
                                <h3 className="text-sm font-semibold mb-3 text-purple-400">Recent Projects</h3>
                                <div className="space-y-2">
                                    {projects.filter(p => p.type === 'studio').map(project => (
                                        <div key={project.id} className="bg-slate-800 rounded p-3 hover:bg-slate-700 transition-colors cursor-pointer">
                                            <div className="flex items-center justify-between">
                                                <div>
                                                    <div className="text-sm font-medium">{project.name}</div>
                                                    <div className="text-xs text-slate-400">{project.modified}</div>
                                                </div>
                                                <div className={`w-2 h-2 rounded-full ${
                                                    project.status === 'active' ? 'bg-green-400' : 
                                                    project.status === 'completed' ? 'bg-blue-400' : 'bg-yellow-400'
                                                }`} />
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Music Module Component
        const HeadyMusic = ({ projects }) => {
            const [isPlaying, setIsPlaying] = useState(false);
            const [currentTrack, setCurrentTrack] = useState(null);
            const [volume, setVolume] = useState(75);

            return (
                <div className="h-full flex flex-col fade-in">
                    <div className="glass-morphism p-4 border-b border-slate-700">
                        <div className="flex items-center justify-between">
                            <h2 className="text-xl font-bold bg-gradient-to-r from-green-400 to-teal-400 bg-clip-text text-transparent">Music Studio</h2>
                            <div className="flex items-center gap-4">
                                <div className="flex items-center gap-2">
                                    <Volume2 size={16} className="text-slate-400" />
                                    <input 
                                        type="range" 
                                        min="0" 
                                        max="100" 
                                        value={volume}
                                        onChange={(e) => setVolume(e.target.value)}
                                        className="w-20 accent-green-500" 
                                    />
                                </div>
                                <button 
                                    onClick={() => setIsPlaying(!isPlaying)}
                                    className="p-2 bg-green-600 rounded hover:bg-green-700 transition-colors"
                                >
                                    {isPlaying ? <Pause size={16} /> : <Play size={16} />}
                                </button>
                            </div>
                        </div>
                    </div>
                    <div className="flex-1 p-4">
                        <div className="grid grid-cols-3 gap-4 h-full">
                            <div className="glass-morphism rounded-lg p-4">
                                <h3 className="text-sm font-semibold mb-3 text-green-400">Tracks</h3>
                                <div className="space-y-2">
                                    {projects.filter(p => p.type === 'music').map(project => (
                                        <div key={project.id} className="bg-slate-800 rounded p-3 hover:bg-slate-700 transition-colors cursor-pointer">
                                            <div className="flex items-center justify-between">
                                                <div className="flex items-center gap-2">
                                                    <Music size={14} className="text-green-400" />
                                                    <div>
                                                        <div className="text-sm font-medium">{project.name}</div>
                                                        <div className="text-xs text-slate-400">{project.modified}</div>
                                                    </div>
                                                </div>
                                                <button className="p-1 hover:bg-slate-600 rounded transition-colors">
                                                    <Play size={12} />
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                            <div className="glass-morphism rounded-lg p-4">
                                <h3 className="text-sm font-semibold mb-3 text-green-400">Mixer</h3>
                                <div className="space-y-3">
                                    {['Drums', 'Bass', 'Guitar', 'Vocals', 'Synth'].map((track, i) => (
                                        <div key={track} className="flex items-center gap-3">
                                            <span className="text-xs w-16">{track}</span>
                                            <input type="range" className="flex-1 accent-green-500" />
                                            <span className="text-xs w-8 text-right">75%</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                            <div className="glass-morphism rounded-lg p-4">
                                <h3 className="text-sm font-semibold mb-3 text-green-400">Effects</h3>
                                <div className="grid grid-cols-2 gap-2">
                                    {['Reverb', 'Delay', 'Chorus', 'Distortion', 'EQ', 'Compressor'].map(effect => (
                                        <button key={effect} className="px-3 py-2 bg-slate-700 rounded text-xs hover:bg-slate-600 transition-colors">
                                            {effect}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Education Module Component
        const HeadyEd = ({ projects }) => {
            const [courses, setCourses] = useState([
                { id: 1, title: 'Introduction to AI', students: 45, progress: 75, status: 'active' },
                { id: 2, title: 'Web Development', students: 32, progress: 60, status: 'active' },
                { id: 3, title: 'Data Science', students: 28, progress: 45, status: 'draft' }
            ]);

            return (
                <div className="h-full flex flex-col fade-in">
                    <div className="glass-morphism p-4 border-b border-slate-700">
                        <div className="flex items-center justify-between">
                            <h2 className="text-xl font-bold bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">Learning Platform</h2>
                            <button className="px-4 py-2 bg-blue-600 rounded text-xs font-bold hover:bg-blue-700 transition-colors">
                                Create Course
                            </button>
                        </div>
                    </div>
                    <div className="flex-1 p-4">
                        <div className="grid grid-cols-2 gap-4 h-full">
                            <div className="glass-morphism rounded-lg p-4 overflow-y-auto custom-scrollbar">
                                <h3 className="text-sm font-semibold mb-3 text-blue-400">Active Courses</h3>
                                <div className="space-y-3">
                                    {courses.map(course => (
                                        <div key={course.id} className="bg-slate-800 rounded p-4 hover:bg-slate-700 transition-colors">
                                            <div className="flex items-center justify-between mb-2">
                                                <h4 className="font-medium">{course.title}</h4>
                                                <span className={`px-2 py-1 rounded text-xs ${
                                                    course.status === 'active' ? 'bg-green-900 text-green-200' : 'bg-yellow-900 text-yellow-200'
                                                }`}>
                                                    {course.status}
                                                </span>
                                            </div>
                                            <div className="text-sm text-slate-400 mb-2">
                                                {course.students} students enrolled
                                            </div>
                                            <div className="w-full bg-slate-700 rounded-full h-2">
                                                <div 
                                                    className="bg-blue-500 h-2 rounded-full transition-all duration-300"
                                                    style={{ width: `${course.progress}%` }}
                                                />
                                            </div>
                                            <div className="text-xs text-slate-400 mt-1">{course.progress}% complete</div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                            <div className="glass-morphism rounded-lg p-4">
                                <h3 className="text-sm font-semibold mb-3 text-blue-400">Analytics Dashboard</h3>
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="bg-slate-800 rounded p-3">
                                        <div className="text-2xl font-bold text-blue-400">105</div>
                                        <div className="text-xs text-slate-400">Total Students</div>
                                    </div>
                                    <div className="bg-slate-800 rounded p-3">
                                        <div className="text-2xl font-bold text-green-400">12</div>
                                        <div className="text-xs text-slate-400">Active Courses</div>
                                    </div>
                                    <div className="bg-slate-800 rounded p-3">
                                        <div className="text-2xl font-bold text-purple-400">89%</div>
                                        <div className="text-xs text-slate-400">Completion Rate</div>
                                    </div>
                                    <div className="bg-slate-800 rounded p-3">
                                        <div className="text-2xl font-bold text-orange-400">4.8</div>
                                        <div className="text-xs text-slate-400">Avg Rating</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Development Module Component
        const HeadyDev = ({ projects }) => {
            return (
                <div className="h-full flex flex-col fade-in">
                    <div className="glass-morphism p-4 border-b border-slate-700">
                        <div className="flex items-center justify-between">
                            <h2 className="text-xl font-bold bg-gradient-to-r from-orange-400 to-red-400 bg-clip-text text-transparent">Development Hub</h2>
                            <div className="flex gap-2">
                                <button className="px-4 py-2 bg-orange-600 rounded text-xs font-bold hover:bg-orange-700 transition-colors">
                                    New Project
                                </button>
                                <button className="px-4 py-2 bg-slate-700 rounded text-xs font-bold hover:bg-slate-600 transition-colors">
                                    Git Sync
                                </button>
                            </div>
                        </div>
                    </div>
                    <div className="flex-1 p-4">
                        <div className="h-full glass-morphism rounded-lg p-4 flex items-center justify-center">
                            <div className="text-center">
                                <Code size={48} className="mx-auto mb-4 text-orange-400" />
                                <h3 className="text-lg font-semibold mb-2">Integrated Development Environment</h3>
                                <p className="text-slate-400 text-sm mb-4">Full-stack development with AI assistance</p>
                                <div className="flex gap-2 justify-center">
                                    <button className="px-4 py-2 bg-orange-600 rounded text-xs font-bold hover:bg-orange-700 transition-colors">
                                        Launch IDE
                                    </button>
                                    <button className="px-4 py-2 bg-slate-700 rounded text-xs font-bold hover:bg-slate-600 transition-colors">
                                        View Repositories
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Cloud Module Component
        const HeadyCloud = () => {
            return (
                <div className="h-full flex flex-col fade-in">
                    <div className="glass-morphism p-4 border-b border-slate-700">
                        <div className="flex items-center justify-between">
                            <h2 className="text-xl font-bold bg-gradient-to-r from-cyan-400 to-blue-400 bg-clip-text text-transparent">Cloud Services</h2>
                            <div className="flex items-center gap-2">
                                <div className="w-2 h-2 bg-green-400 rounded-full pulse-animation"></div>
                                <span className="text-xs text-green-400">All Systems Operational</span>
                            </div>
                        </div>
                    </div>
                    <div className="flex-1 p-4">
                        <div className="grid grid-cols-3 gap-4 h-full">
                            <div className="glass-morphism rounded-lg p-4">
                                <h3 className="text-sm font-semibold mb-3 text-cyan-400">Storage</h3>
                                <div className="space-y-2">
                                    <div className="flex justify-between text-sm">
                                        <span>Used</span>
                                        <span>45.2 GB</span>
                                    </div>
                                    <div className="w-full bg-slate-700 rounded-full h-2">
                                        <div className="bg-cyan-500 h-2 rounded-full" style={{ width: '45%' }}></div>
                                    </div>
                                    <div className="text-xs text-slate-400">100 GB Total</div>
                                </div>
                            </div>
                            <div className="glass-morphism rounded-lg p-4">
                                <h3 className="text-sm font-semibold mb-3 text-cyan-400">API Gateway</h3>
                                <div className="space-y-2 text-sm">
                                    <div className="flex justify-between">
                                        <span>Requests Today</span>
                                        <span>1.2M</span>
                                    </div>
                                    <div className="flex justify-between">
                                        <span>Avg Response</span>
                                        <span>120ms</span>
                                    </div>
                                    <div className="flex justify-between">
                                        <span>Success Rate</span>
                                        <span>99.9%</span>
                                    </div>
                                </div>
                            </div>
                            <div className="glass-morphism rounded-lg p-4">
                                <h3 className="text-sm font-semibold mb-3 text-cyan-400">Services</h3>
                                <div className="space-y-2">
                                    {['Database', 'Cache', 'Queue', 'CDN'].map(service => (
                                        <div key={service} className="flex items-center justify-between">
                                            <span className="text-sm">{service}</span>
                                            <div className="w-2 h-2 bg-green-400 rounded-full"></div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Sidebar Navigation
        const Sidebar = ({ activeModule, setActiveModule, sidebarCollapsed, setSidebarCollapsed }) => {
            return (
                <div className={`${sidebarCollapsed ? 'w-16' : 'w-64'} bg-slate-900 border-r border-slate-800 transition-all duration-300 flex flex-col`}>
                    <div className="p-4 border-b border-slate-800">
                        <div className="flex items-center justify-between">
                            {!sidebarCollapsed && (
                                <div className="flex items-center gap-2">
                                    <Layers className="text-cyan-400" size={24} />
                                    <span className="font-bold text-lg">HeadyStudio</span>
                                </div>
                            )}
                            <button 
                                onClick={() => setSidebarCollapsed(!sidebarCollapsed)}
                                className="p-1 hover:bg-slate-800 rounded transition-colors"
                            >
                                {sidebarCollapsed ? <ChevronRight size={16} /> : <ChevronLeft size={16} />}
                            </button>
                        </div>
                    </div>
                    
                    <div className="flex-1 p-2">
                        {Object.values(modules).map(module => {
                            const Icon = module.icon;
                            return (
                                <button
                                    key={module.id}
                                    onClick={() => setActiveModule(module.id)}
                                    className={`w-full flex items-center gap-3 p-3 rounded-lg transition-all mb-1 ${
                                        activeModule === module.id 
                                            ? 'bg-gradient-to-r ' + module.color + ' text-white' 
                                            : 'hover:bg-slate-800 text-slate-300'
                                    }`}
                                >
                                    <Icon size={20} />
                                    {!sidebarCollapsed && (
                                        <div className="text-left">
                                            <div className="font-medium text-sm">{module.name}</div>
                                            <div className="text-xs opacity-75">{module.description}</div>
                                        </div>
                                    )}
                                </button>
                            );
                        })}
                    </div>

                    <div className="p-2 border-t border-slate-800">
                        <button className="w-full flex items-center gap-3 p-3 rounded-lg hover:bg-slate-800 text-slate-300 transition-all">
                            <Settings size={20} />
                            {!sidebarCollapsed && <span className="text-sm">Settings</span>}
                        </button>
                    </div>
                </div>
            );
        };

        // Header Component
        const Header = ({ user, notifications, globalSearch, setGlobalSearch }) => {
            const [showNotifications, setShowNotifications] = useState(false);
            
            return (
                <div className="h-16 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-6">
                    <div className="flex items-center gap-4 flex-1">
                        <div className="relative max-w-md flex-1">
                            <Search className="absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400" size={16} />
                            <input
                                type="text"
                                placeholder="Search projects, tools, or features..."
                                value={globalSearch}
                                onChange={(e) => setGlobalSearch(e.target.value)}
                                className="w-full pl-10 pr-4 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm focus:outline-none focus:border-cyan-500 transition-colors"
                            />
                        </div>
                    </div>
                    
                    <div className="flex items-center gap-4">
                        <div className="flex items-center gap-2">
                            <div className="w-2 h-2 bg-green-400 rounded-full pulse-animation"></div>
                            <span className="text-xs text-green-400">Connected</span>
                        </div>
                        
                        <div className="relative">
                            <button
                                onClick={() => setShowNotifications(!showNotifications)}
                                className="relative p-2 hover:bg-slate-800 rounded-lg transition-colors"
                            >
                                <Bell size={18} />
                                {notifications.length > 0 && (
                                    <span className="absolute -top-1 -right-1 w-5 h-5 bg-red-500 rounded-full text-xs flex items-center justify-center">
                                        {notifications.length}
                                    </span>
                                )}
                            </button>
                            
                            {showNotifications && (
                                <div className="absolute right-0 mt-2 w-80 glass-morphism rounded-lg shadow-lg z-50">
                                    <div className="p-4 border-b border-slate-700">
                                        <h3 className="font-semibold">Notifications</h3>
                                    </div>
                                    <div className="max-h-96 overflow-y-auto">
                                        {notifications.length === 0 ? (
                                            <div className="p-4 text-center text-slate-400">
                                                No new notifications
                                            </div>
                                        ) : (
                                            notifications.map(notif => (
                                                <div key={notif.id} className="p-4 border-b border-slate-700 hover:bg-slate-800 transition-colors">
                                                    <div className="text-sm">{notif.message}</div>
                                                    <div className="text-xs text-slate-400 mt-1">{notif.time}</div>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            )}
                        </div>
                        
                        <div className="flex items-center gap-3 pl-4 border-l border-slate-700">
                            <div className="text-right">
                                <div className="text-sm font-medium">{user.name}</div>
                                <div className="text-xs text-slate-400">{user.role}</div>
                            </div>
                            <div className="w-8 h-8 bg-gradient-to-r from-purple-500 to-pink-500 rounded-full flex items-center justify-center text-sm">
                                {user.avatar}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Main App Component
        const App = () => {
            const state = useHeadyState();
            const {
                activeModule, setActiveModule,
                user, notifications, setNotifications,
                globalSearch, setGlobalSearch,
                sidebarCollapsed, setSidebarCollapsed,
                projects
            } = state;

            // Initialize with some notifications
            useEffect(() => {
                setNotifications([
                    { id: 1, message: 'New collaboration request from John', time: '5 min ago', type: 'info' },
                    { id: 2, message: 'Project "Symphony No.5" exported successfully', time: '1 hour ago', type: 'success' },
                    { id: 3, message: 'System update available', time: '2 hours ago', type: 'warning' }
                ]);
            }, []);

            const renderActiveModule = () => {
                const moduleProps = { projects, onProjectSelect: (id) => console.log('Selected project:', id) };
                
                switch (activeModule) {
                    case 'studio': return <HeadyStudio {...moduleProps} />;
                    case 'music': return <HeadyMusic {...moduleProps} />;
                    case 'education': return <HeadyEd {...moduleProps} />;
                    case 'development': return <HeadyDev {...moduleProps} />;
                    case 'cloud': return <HeadyCloud />;
                    default: return <HeadyStudio {...moduleProps} />;
                }
            };

            const currentModule = modules[activeModule];

            return (
                <div className="h-screen flex flex-col bg-slate-950">
                    <Header 
                        user={user} 
                        notifications={notifications}
                        globalSearch={globalSearch}
                        setGlobalSearch={setGlobalSearch}
                    />
                    
                    <div className="flex-1 flex overflow-hidden">
                        <Sidebar 
                            activeModule={activeModule}
                            setActiveModule={setActiveModule}
                            sidebarCollapsed={sidebarCollapsed}
                            setSidebarCollapsed={setSidebarCollapsed}
                        />
                        
                        <div className="flex-1 flex flex-col">
                            <div className="h-12 glass-morphism border-b border-slate-800 flex items-center px-6">
                                <div className="flex items-center gap-3">
                                    <div className={`p-2 rounded-lg bg-gradient-to-r ${currentModule.color}`}>
                                        <currentModule.icon size={16} />
                                    </div>
                                    <div>
                                        <h1 className="font-semibold">{currentModule.name}</h1>
                                        <p className="text-xs text-slate-400">{currentModule.description}</p>
                                    </div>
                                </div>
                                
                                <div className="ml-auto flex items-center gap-2">
                                    {currentModule.features.map(feature => (
                                        <span key={feature} className="px-2 py-1 bg-slate-800 rounded text-xs">
                                            {feature}
                                        </span>
                                    ))}
                                </div>
                            </div>
                            
                            <div className="flex-1 overflow-hidden">
                                {renderActiveModule()}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
