<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeadyHive Command v17.1</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { Terminal, Activity, Code, Layers, Play, Server } = lucide;

        function uniq(arr) {
            return Array.from(new Set((arr || []).filter(Boolean)));
        }

        function getOrigin() {
            try {
                if (window.location && window.location.origin && window.location.origin !== 'null') {
                    return window.location.origin;
                }
            } catch (e) {}
            return null;
        }

        function apiUrls(path) {
            const origin = getOrigin();
            const bases = uniq([
                origin,
                'http://localhost:3100',
                'http://localhost:3000'
            ]);
            return bases.map(b => `${b}${path}`);
        }

        function lensUrls() {
            const origin = getOrigin();
            return uniq([
                origin ? `${origin}/shared/state/lens_stream.json` : null,
                'shared/state/lens_stream.json',
                'http://localhost:8090/shared/state/lens_stream.json',
                'http://localhost:8080/shared/state/lens_stream.json'
            ]);
        }

        async function fetchJsonWithFallback(urls, options) {
            let lastError = null;
            for (const url of urls) {
                try {
                    const res = await fetch(url, options);
                    if (!res.ok) {
                        lastError = new Error(`HTTP ${res.status}`);
                        continue;
                    }
                    return { url, data: await res.json() };
                } catch (e) {
                    lastError = e;
                }
            }
            throw lastError || new Error('fetch_failed');
        }

        async function postJsonWithFallback(urls, body) {
            return fetchJsonWithFallback(urls, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
        }

        function parseEventTime(ts) {
            if (!ts) return null;
            const raw = String(ts).trim();
            let d = new Date(raw);
            if (!Number.isNaN(d.getTime())) return d;

            const trimmed = raw.replace(/(\.\d{3})\d+/, '$1');
            d = new Date(trimmed);
            if (!Number.isNaN(d.getTime())) return d;
            return null;
        }

        function normalizeEvent(evt) {
            return {
                source: evt.source || evt.source_container || 'UNKNOWN',
                type: evt.type || evt.security_level || evt.operation_type || 'EVENT',
                message: evt.message || evt.operation_type || '',
                timestamp: evt.timestamp || '',
                raw: evt
            };
        }

        function formatAgeMs(ms) {
            if (ms === null || ms === undefined) return '';
            const s = Math.floor(ms / 1000);
            if (s < 60) return `${s}s`;
            const m = Math.floor(s / 60);
            if (m < 60) return `${m}m`;
            const h = Math.floor(m / 60);
            return `${h}h`;
        }

        function App() {
            const [tab, setTab] = useState('DASHBOARD');
            const [logs, setLogs] = useState([]);
            const [tasks, setTasks] = useState([]);
            const [questions, setQuestions] = useState([]);
            const [instruction, setInstruction] = useState('');
            const [connections, setConnections] = useState([]);
            const [connectionForm, setConnectionForm] = useState({
                type: 'github',
                name: '',
                token_env: 'GITHUB_TOKEN',
                default_owner: '',
                default_repo: '',
                deploy_hook_env: 'RENDER_DEPLOY_HOOK_URL',
                hook_method: 'POST'
            });
            const [connectionMessage, setConnectionMessage] = useState('');
            const [githubRepoForm, setGithubRepoForm] = useState({
                connection_id: '',
                repo: '',
                description: '',
                private: true
            });
            const [githubIssueForm, setGithubIssueForm] = useState({
                connection_id: '',
                owner: '',
                repo: '',
                title: '',
                body: ''
            });
            const [renderDeployForm, setRenderDeployForm] = useState({
                connection_id: ''
            });
            const [appMessage, setAppMessage] = useState('');

            const [apiBase, setApiBase] = useState(null);
            const [apiOk, setApiOk] = useState(false);
            const [lensOk, setLensOk] = useState(false);
            const [lastLensEventAt, setLastLensEventAt] = useState(null);

            const [logQuery, setLogQuery] = useState('');
            const [logSource, setLogSource] = useState('ALL');
            const [logType, setLogType] = useState('ALL');

            const [answerDrafts, setAnswerDrafts] = useState({});

            const normalizedLogs = useMemo(() => (logs || []).map(normalizeEvent), [logs]);
            const logSources = useMemo(() => {
                return uniq(normalizedLogs.map(l => l.source)).sort();
            }, [normalizedLogs]);
            const logTypes = useMemo(() => {
                return uniq(normalizedLogs.map(l => l.type)).sort();
            }, [normalizedLogs]);
            const filteredLogs = useMemo(() => {
                const q = (logQuery || '').trim().toLowerCase();
                return (normalizedLogs || []).filter(l => {
                    if (logSource !== 'ALL' && l.source !== logSource) return false;
                    if (logType !== 'ALL' && l.type !== logType) return false;
                    if (!q) return true;
                    return (
                        (l.source || '').toLowerCase().includes(q) ||
                        (l.type || '').toLowerCase().includes(q) ||
                        (l.message || '').toLowerCase().includes(q)
                    );
                });
            }, [normalizedLogs, logQuery, logSource, logType]);

            const lensAgeMs = useMemo(() => {
                if (!lastLensEventAt) return null;
                return Date.now() - lastLensEventAt.getTime();
            }, [lastLensEventAt]);

            const refresh = async () => {
                try {
                    const { url: taskUrl, data: taskData } = await fetchJsonWithFallback(apiUrls('/api/tasks'));
                    setTasks(Array.isArray(taskData) ? taskData : []);
                    setApiOk(true);
                    setApiBase(taskUrl.replace(/\/api\/tasks.*$/, ''));
                } catch (e) {
                    setApiOk(false);
                }

                try {
                    const { data: qData } = await fetchJsonWithFallback(apiUrls('/api/questions?status=PENDING'));
                    setQuestions(Array.isArray(qData) ? qData : []);
                } catch (e) {
                    setQuestions([]);
                }

                try {
                    const { data: cData } = await fetchJsonWithFallback(apiUrls('/api/connections'));
                    const list = (cData && Array.isArray(cData.connections)) ? cData.connections : [];
                    setConnections(list);
                } catch (e) {
                    setConnections([]);
                }

                try {
                    const { data: lData } = await fetchJsonWithFallback(lensUrls());
                    const events = (lData && lData.events) ? lData.events : (Array.isArray(lData) ? lData : []);
                    setLogs(events);
                    setLensOk(true);

                    const first = Array.isArray(events) && events.length ? events[0] : null;
                    const firstTs = first ? parseEventTime(first.timestamp) : null;
                    setLastLensEventAt(firstTs);
                } catch (e) {
                    setLensOk(false);
                }
            };

            useEffect(() => {
                refresh();
                const i = setInterval(refresh, 1500);
                return () => clearInterval(i);
            }, []);

            const submitTask = async (e) => {
                e.preventDefault();
                const trimmed = (instruction || '').trim();
                if (!trimmed) return;
                try {
                    await postJsonWithFallback(apiUrls('/api/tasks'), { instruction: trimmed, priority: 'NORMAL' });
                    setInstruction('');
                    refresh();
                } catch (e) {}
            };

            const createConnection = async (e) => {
                e.preventDefault();
                setConnectionMessage('');
                try {
                    const type = (connectionForm.type || 'github').toLowerCase();
                    const name = (connectionForm.name || '').trim();
                    let config = {};
                    if (type === 'github') {
                        config = {
                            token_env: (connectionForm.token_env || 'GITHUB_TOKEN').trim(),
                            default_owner: (connectionForm.default_owner || '').trim() || null,
                            default_repo: (connectionForm.default_repo || '').trim() || null
                        };
                    } else {
                        config = {
                            deploy_hook_env: (connectionForm.deploy_hook_env || 'RENDER_DEPLOY_HOOK_URL').trim(),
                            hook_method: (connectionForm.hook_method || 'POST').toUpperCase()
                        };
                    }

                    const payload = {
                        type,
                        name: name || undefined,
                        config
                    };

                    const { data } = await postJsonWithFallback(apiUrls('/api/connections'), payload);
                    const id = data?.connection?.id || '';
                    setConnectionMessage(`Created ${type.toUpperCase()} connection ${id}`);
                    refresh();
                } catch (e) {
                    setConnectionMessage(`Create failed: ${e?.message || String(e)}`);
                }
            };

            const deleteConnection = async (connectionId) => {
                setConnectionMessage('');
                try {
                    await fetchJsonWithFallback(apiUrls(`/api/connections/${connectionId}`), { method: 'DELETE' });
                    setConnectionMessage(`Deleted connection ${connectionId}`);
                    refresh();
                } catch (e) {
                    setConnectionMessage(`Delete failed: ${e?.message || String(e)}`);
                }
            };

            const testConnection = async (connectionId) => {
                setConnectionMessage('');
                try {
                    const { data } = await postJsonWithFallback(apiUrls(`/api/connections/${connectionId}/test`), {});
                    if (data && data.ok) {
                        setConnectionMessage(`Test OK: ${connectionId}`);
                    } else {
                        setConnectionMessage(`Test failed: ${connectionId} (${data?.error || 'error'})`);
                    }
                    refresh();
                } catch (e) {
                    setConnectionMessage(`Test failed: ${e?.message || String(e)}`);
                }
            };

            const createGithubRepo = async (e) => {
                e.preventDefault();
                setAppMessage('');
                const repo = (githubRepoForm.repo || '').trim();
                const connection_id = (githubRepoForm.connection_id || '').trim();
                if (!connection_id || !repo) {
                    setAppMessage('GitHub repo create requires connection + repo name.');
                    return;
                }
                try {
                    const { data } = await postJsonWithFallback(apiUrls('/api/apps/github/create_repo'), {
                        connection_id,
                        repo,
                        description: (githubRepoForm.description || '').trim(),
                        private: Boolean(githubRepoForm.private)
                    });
                    setAppMessage(`Repo created: ${data?.repo?.full_name || repo}`);
                } catch (e) {
                    setAppMessage(`Repo create failed: ${e?.message || String(e)}`);
                }
            };

            const createGithubIssue = async (e) => {
                e.preventDefault();
                setAppMessage('');
                const connection_id = (githubIssueForm.connection_id || '').trim();
                const owner = (githubIssueForm.owner || '').trim();
                const repo = (githubIssueForm.repo || '').trim();
                const title = (githubIssueForm.title || '').trim();
                if (!connection_id || !owner || !repo || !title) {
                    setAppMessage('GitHub issue create requires connection + owner + repo + title.');
                    return;
                }
                try {
                    const { data } = await postJsonWithFallback(apiUrls('/api/apps/github/create_issue'), {
                        connection_id,
                        owner,
                        repo,
                        title,
                        body: (githubIssueForm.body || '').trim()
                    });
                    setAppMessage(`Issue created: #${data?.issue?.number || ''} ${owner}/${repo}`);
                } catch (e) {
                    setAppMessage(`Issue create failed: ${e?.message || String(e)}`);
                }
            };

            const triggerRenderDeploy = async (e) => {
                e.preventDefault();
                setAppMessage('');
                const connection_id = (renderDeployForm.connection_id || '').trim();
                if (!connection_id) {
                    setAppMessage('Render deploy requires a Render connection.');
                    return;
                }
                try {
                    const { data } = await postJsonWithFallback(apiUrls('/api/apps/render/deploy'), { connection_id });
                    if (data && data.success) {
                        setAppMessage(`Render deploy triggered (HTTP ${data.status}).`);
                    } else {
                        setAppMessage(`Render deploy failed (HTTP ${data?.status || 'unknown'}).`);
                    }
                } catch (e) {
                    setAppMessage(`Render deploy failed: ${e?.message || String(e)}`);
                }
            };

            const answerQuestion = async (questionId) => {
                const answer = (answerDrafts[questionId] || '').trim();
                if (!answer) return;
                try {
                    await postJsonWithFallback(apiUrls(`/api/questions/${questionId}/answer`), {
                        answer,
                        answered_by: 'ADMIN_UI'
                    });
                    setAnswerDrafts(prev => ({ ...prev, [questionId]: '' }));
                    refresh();
                } catch (e) {}
            };

            return (
                <div className="h-screen flex flex-col">
                    {/* TOP BAR */}
                    <div className="bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center">
                        <h1 className="text-xl font-bold text-cyan-400 flex items-center gap-2"><Layers /> HEADY<span className="text-white">HIVE</span> <span className="text-xs text-slate-500">v17.1 MCP</span></h1>
                        <div className="flex items-center gap-3">
                            <div className={`text-[10px] px-2 py-1 rounded border ${apiOk ? 'border-green-700 bg-green-950 text-green-200' : 'border-slate-700 bg-slate-900 text-slate-400'}`}>
                                API {apiOk ? 'OK' : 'OFF'}{apiBase ? ` (${apiBase.replace('http://', '')})` : ''}
                            </div>
                            <div className={`text-[10px] px-2 py-1 rounded border ${lensOk ? 'border-green-700 bg-green-950 text-green-200' : 'border-slate-700 bg-slate-900 text-slate-400'}`}>
                                GLASS BOX {lensOk ? `LIVE${lensAgeMs !== null ? ` (${formatAgeMs(lensAgeMs)})` : ''}` : 'OFF'}
                            </div>
                            <button onClick={()=>setTab('DASHBOARD')} className={`px-4 py-2 rounded text-xs font-bold ${tab==='DASHBOARD'?'bg-cyan-600':'bg-slate-800'}`}>DASHBOARD</button>
                            <button onClick={()=>setTab('QUESTIONS')} className={`px-4 py-2 rounded text-xs font-bold ${tab==='QUESTIONS'?'bg-amber-600':'bg-slate-800'}`}>QUESTIONS</button>
                            <button onClick={()=>setTab('CONNECTIONS')} className={`px-4 py-2 rounded text-xs font-bold ${tab==='CONNECTIONS'?'bg-emerald-600':'bg-slate-800'}`}>CONNECTIONS</button>
                            <button onClick={()=>setTab('IDE')} className={`px-4 py-2 rounded text-xs font-bold flex items-center gap-2 ${tab==='IDE'?'bg-purple-600':'bg-slate-800'}`}><Code size={14}/> VS CODE INSIDERS</button>
                        </div>
                    </div>

                    {/* CONTENT */}
                    <div className="flex-1 overflow-hidden">
                        {tab === 'DASHBOARD' && (
                            <div className="h-full flex gap-4 p-4">
                                {/* LEFT: TASK DEF & LOGS */}
                                <div className="w-1/3 flex flex-col gap-4">
                                    <div className="bg-slate-800 p-4 rounded border border-slate-700">
                                        <h2 className="font-bold text-sm mb-2 text-gray-400">INTELLIGENT TASK ORCHESTRATION</h2>
                                        <form onSubmit={submitTask} className="space-y-3">
                                            <textarea value={instruction} onChange={e=>setInstruction(e.target.value)} placeholder="E.g., Build a User Repo with Git..." className="w-full bg-slate-900 border border-slate-600 rounded p-2 text-sm text-white" rows="2"></textarea>
                                            <button className="bg-cyan-600 px-4 py-1 rounded font-bold text-xs w-full">INITIATE BUILD</button>
                                        </form>
                                    </div>
                                    <div className="flex-1 bg-slate-900 rounded p-4 border border-slate-800 overflow-y-auto">
                                        <div className="text-xs font-bold text-slate-500 mb-2">MCP ORCHESTRATION LOGS</div>
                                        <div className="flex gap-2 mb-3">
                                            <input value={logQuery} onChange={e=>setLogQuery(e.target.value)} placeholder="Filter..." className="flex-1 bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-white" />
                                            <select value={logSource} onChange={e=>setLogSource(e.target.value)} className="bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-white">
                                                <option value="ALL">ALL</option>
                                                {logSources.map(s => (<option key={s} value={s}>{s}</option>))}
                                            </select>
                                            <select value={logType} onChange={e=>setLogType(e.target.value)} className="bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-white">
                                                <option value="ALL">ALL</option>
                                                {logTypes.map(t => (<option key={t} value={t}>{t}</option>))}
                                            </select>
                                        </div>
                                        {filteredLogs.slice(0, 75).map((l, i) => (
                                            <div key={i} className="text-xs mb-2 border-b border-slate-800 pb-1">
                                                <span className={`font-bold ${l.type==='SECURITY' || l.type==='critical'?'text-red-500':l.type==='ADVICE' || l.type==='warning'?'text-yellow-500':'text-cyan-500'}`}>[{l.source}]</span>
                                                <span className="text-slate-500 ml-2">{l.type}</span>
                                                <span className="text-slate-300 ml-2">{l.message}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* RIGHT: PIPELINE STATUS */}
                                <div className="flex-1 bg-slate-800 rounded p-6 border border-slate-700 overflow-y-auto">
                                    <h2 className="text-lg font-bold mb-4">ACTIVE BUILD PIPELINE</h2>
                                    <div className="space-y-2">
                                        {tasks.slice().reverse().map(t => (
                                            <div key={t.id} className="bg-slate-900 p-3 rounded border border-slate-600 flex justify-between items-center">
                                                <div>
                                                    <div className="font-bold text-sm">{t.instruction}</div>
                                                    <div className="text-[10px] text-slate-500 flex gap-2 mt-1">
                                                        <span>ID: {t.id}</span>
                                                        {t.required_mcp_tools && (
                                                            <span className="text-green-400 flex gap-1 items-center"><Server size={10}/> Tools: {t.required_mcp_tools.join(', ')}</span>
                                                        )}
                                                    </div>
                                                </div>
                                                <span className={`text-xs px-2 py-1 rounded font-bold ${t.status==='COMPLETE'?'bg-green-900 text-green-200':t.status==='BUILDING'?'bg-blue-900 text-blue-200 animate-pulse':t.status==='WAITING_FOR_ANSWER'?'bg-yellow-900 text-yellow-200 animate-pulse':t.status==='READY_TO_BUILD' || t.status==='STAGED'?'bg-purple-900 text-purple-200':'bg-slate-700 text-slate-200'}`}>
                                                    {t.status}
                                                </span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                        {tab === 'QUESTIONS' && (
                            <div className="h-full p-4 overflow-y-auto">
                                <div className="bg-slate-800 rounded p-4 border border-slate-700">
                                    <div className="flex items-center justify-between">
                                        <h2 className="text-lg font-bold">HITL QUESTIONS</h2>
                                        <button onClick={refresh} className="bg-slate-900 border border-slate-700 px-3 py-1 rounded text-xs font-bold">REFRESH</button>
                                    </div>
                                    <div className="text-xs text-slate-400 mt-2">Pending questions block tasks in <span className="font-bold">WAITING_FOR_ANSWER</span>.</div>
                                </div>

                                <div className="mt-4 space-y-3">
                                    {questions.length === 0 && (
                                        <div className="text-sm text-slate-400">No pending questions.</div>
                                    )}
                                    {questions.map(q => (
                                        <div key={q.id} className="bg-slate-900 rounded p-4 border border-slate-700">
                                            <div className="text-xs text-slate-500">ID: {q.id}{q.task_id ? `  |  Task: ${q.task_id}` : ''}{q.asked_by ? `  |  By: ${q.asked_by}` : ''}</div>
                                            <div className="mt-2 font-bold text-sm text-slate-200">{q.question}</div>
                                            <textarea value={answerDrafts[q.id] || ''} onChange={e=>setAnswerDrafts(prev=>({ ...prev, [q.id]: e.target.value }))} placeholder="Type answer..." className="w-full mt-3 bg-slate-800 border border-slate-700 rounded p-2 text-sm text-white" rows="2"></textarea>
                                            <div className="mt-3 flex justify-end">
                                                <button onClick={()=>answerQuestion(q.id)} className="bg-amber-600 px-4 py-2 rounded font-bold text-xs">SUBMIT ANSWER</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                        {tab === 'CONNECTIONS' && (
                            <div className="h-full p-4 overflow-y-auto">
                                <div className="bg-slate-800 rounded p-4 border border-slate-700">
                                    <div className="flex items-center justify-between">
                                        <h2 className="text-lg font-bold">CONNECTIONS</h2>
                                        <button onClick={refresh} className="bg-slate-900 border border-slate-700 px-3 py-1 rounded text-xs font-bold">REFRESH</button>
                                    </div>
                                    {connectionMessage && (
                                        <div className="mt-2 text-xs text-slate-300">{connectionMessage}</div>
                                    )}
                                    <form onSubmit={createConnection} className="mt-4 grid grid-cols-1 md:grid-cols-2 gap-3">
                                        <div>
                                            <div className="text-xs text-slate-400 mb-1">Type</div>
                                            <select value={connectionForm.type} onChange={e=>setConnectionForm(prev=>({ ...prev, type: e.target.value }))} className="w-full bg-slate-900 border border-slate-700 rounded px-2 py-2 text-xs text-white">
                                                <option value="github">GitHub</option>
                                                <option value="render">Render</option>
                                            </select>
                                        </div>
                                        <div>
                                            <div className="text-xs text-slate-400 mb-1">Name</div>
                                            <input value={connectionForm.name} onChange={e=>setConnectionForm(prev=>({ ...prev, name: e.target.value }))} placeholder="Optional" className="w-full bg-slate-900 border border-slate-700 rounded px-2 py-2 text-xs text-white" />
                                        </div>

                                        {String(connectionForm.type).toLowerCase() === 'github' && (
                                            <>
                                                <div>
                                                    <div className="text-xs text-slate-400 mb-1">Token Env Var</div>
                                                    <input value={connectionForm.token_env} onChange={e=>setConnectionForm(prev=>({ ...prev, token_env: e.target.value }))} className="w-full bg-slate-900 border border-slate-700 rounded px-2 py-2 text-xs text-white" />
                                                </div>
                                                <div>
                                                    <div className="text-xs text-slate-400 mb-1">Default Owner</div>
                                                    <input value={connectionForm.default_owner} onChange={e=>setConnectionForm(prev=>({ ...prev, default_owner: e.target.value }))} placeholder="Optional" className="w-full bg-slate-900 border border-slate-700 rounded px-2 py-2 text-xs text-white" />
                                                </div>
                                                <div>
                                                    <div className="text-xs text-slate-400 mb-1">Default Repo</div>
                                                    <input value={connectionForm.default_repo} onChange={e=>setConnectionForm(prev=>({ ...prev, default_repo: e.target.value }))} placeholder="Optional" className="w-full bg-slate-900 border border-slate-700 rounded px-2 py-2 text-xs text-white" />
                                                </div>
                                            </>
                                        )}

                                        {String(connectionForm.type).toLowerCase() === 'render' && (
                                            <>
                                                <div>
                                                    <div className="text-xs text-slate-400 mb-1">Deploy Hook Env Var</div>
                                                    <input value={connectionForm.deploy_hook_env} onChange={e=>setConnectionForm(prev=>({ ...prev, deploy_hook_env: e.target.value }))} className="w-full bg-slate-900 border border-slate-700 rounded px-2 py-2 text-xs text-white" />
                                                </div>
                                                <div>
                                                    <div className="text-xs text-slate-400 mb-1">Hook Method</div>
                                                    <select value={connectionForm.hook_method} onChange={e=>setConnectionForm(prev=>({ ...prev, hook_method: e.target.value }))} className="w-full bg-slate-900 border border-slate-700 rounded px-2 py-2 text-xs text-white">
                                                        <option value="POST">POST</option>
                                                        <option value="GET">GET</option>
                                                    </select>
                                                </div>
                                            </>
                                        )}

                                        <div className="md:col-span-2">
                                            <button className="bg-emerald-600 px-4 py-2 rounded font-bold text-xs">CREATE CONNECTION</button>
                                            <div className="text-[10px] text-slate-500 mt-2">
                                                Secrets are read from env vars only (e.g., GITHUB_TOKEN, RENDER_DEPLOY_HOOK_URL).
                                            </div>
                                        </div>
                                    </form>
                                </div>

                                <div className="mt-4 space-y-3">
                                    {connections.length === 0 && (
                                        <div className="text-sm text-slate-400">No connections.</div>
                                    )}
                                    {connections.map(c => (
                                        <div key={c.id} className="bg-slate-900 rounded p-4 border border-slate-700">
                                            <div className="flex items-center justify-between gap-3">
                                                <div>
                                                    <div className="font-bold text-sm text-slate-200">{c.name || String(c.type || '').toUpperCase()}</div>
                                                    <div className="text-xs text-slate-500">ID: {c.id}  |  Type: {c.type}</div>
                                                </div>
                                                <div className="flex gap-2">
                                                    <button onClick={()=>testConnection(c.id)} className="bg-slate-800 border border-slate-700 px-3 py-1 rounded text-xs font-bold">TEST</button>
                                                    <button onClick={()=>deleteConnection(c.id)} className="bg-red-900 border border-red-700 px-3 py-1 rounded text-xs font-bold">DELETE</button>
                                                </div>
                                            </div>
                                            <div className="mt-2 text-xs text-slate-300">
                                                {c.type === 'github' && (<span>Token env: {c.config?.token_env || ''}</span>)}
                                                {c.type === 'render' && (<span>Deploy hook env: {c.config?.deploy_hook_env || ''}</span>)}
                                            </div>
                                            {c.status && (
                                                <div className="mt-2 text-[10px] text-slate-500">
                                                    Last test: {c.status.last_test_at ? c.status.last_test_at : 'never'}{c.status.last_test_ok === true ? ' (OK)' : c.status.last_test_ok === false ? ' (FAIL)' : ''}{c.status.last_error ? ` | ${c.status.last_error}` : ''}
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>

                                <div className="mt-6 bg-slate-800 rounded p-4 border border-slate-700">
                                    <div className="flex items-center justify-between">
                                        <h2 className="text-lg font-bold">APPS</h2>
                                        <button onClick={()=>setAppMessage('')} className="bg-slate-900 border border-slate-700 px-3 py-1 rounded text-xs font-bold">CLEAR</button>
                                    </div>
                                    {appMessage && (
                                        <div className="mt-2 text-xs text-slate-300">{appMessage}</div>
                                    )}

                                    <div className="mt-4 grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div className="bg-slate-900 rounded p-4 border border-slate-700">
                                            <div className="font-bold text-sm">GitHub: Create Repo</div>
                                            <form onSubmit={createGithubRepo} className="mt-3 space-y-2">
                                                <select value={githubRepoForm.connection_id} onChange={e=>setGithubRepoForm(prev=>({ ...prev, connection_id: e.target.value }))} className="w-full bg-slate-800 border border-slate-700 rounded px-2 py-2 text-xs text-white">
                                                    <option value="">Select GitHub connection...</option>
                                                    {connections.filter(x=>x.type==='github').map(x => (
                                                        <option key={x.id} value={x.id}>{x.name || x.id}</option>
                                                    ))}
                                                </select>
                                                <input value={githubRepoForm.repo} onChange={e=>setGithubRepoForm(prev=>({ ...prev, repo: e.target.value }))} placeholder="Repo name" className="w-full bg-slate-800 border border-slate-700 rounded px-2 py-2 text-xs text-white" />
                                                <input value={githubRepoForm.description} onChange={e=>setGithubRepoForm(prev=>({ ...prev, description: e.target.value }))} placeholder="Description (optional)" className="w-full bg-slate-800 border border-slate-700 rounded px-2 py-2 text-xs text-white" />
                                                <label className="flex items-center gap-2 text-xs text-slate-300">
                                                    <input type="checkbox" checked={Boolean(githubRepoForm.private)} onChange={e=>setGithubRepoForm(prev=>({ ...prev, private: e.target.checked }))} />
                                                    Private
                                                </label>
                                                <button className="bg-purple-600 px-4 py-2 rounded font-bold text-xs w-full">CREATE REPO</button>
                                            </form>
                                        </div>

                                        <div className="bg-slate-900 rounded p-4 border border-slate-700">
                                            <div className="font-bold text-sm">GitHub: Create Issue</div>
                                            <form onSubmit={createGithubIssue} className="mt-3 space-y-2">
                                                <select value={githubIssueForm.connection_id} onChange={e=>setGithubIssueForm(prev=>({ ...prev, connection_id: e.target.value }))} className="w-full bg-slate-800 border border-slate-700 rounded px-2 py-2 text-xs text-white">
                                                    <option value="">Select GitHub connection...</option>
                                                    {connections.filter(x=>x.type==='github').map(x => (
                                                        <option key={x.id} value={x.id}>{x.name || x.id}</option>
                                                    ))}
                                                </select>
                                                <div className="grid grid-cols-2 gap-2">
                                                    <input value={githubIssueForm.owner} onChange={e=>setGithubIssueForm(prev=>({ ...prev, owner: e.target.value }))} placeholder="Owner" className="w-full bg-slate-800 border border-slate-700 rounded px-2 py-2 text-xs text-white" />
                                                    <input value={githubIssueForm.repo} onChange={e=>setGithubIssueForm(prev=>({ ...prev, repo: e.target.value }))} placeholder="Repo" className="w-full bg-slate-800 border border-slate-700 rounded px-2 py-2 text-xs text-white" />
                                                </div>
                                                <input value={githubIssueForm.title} onChange={e=>setGithubIssueForm(prev=>({ ...prev, title: e.target.value }))} placeholder="Title" className="w-full bg-slate-800 border border-slate-700 rounded px-2 py-2 text-xs text-white" />
                                                <textarea value={githubIssueForm.body} onChange={e=>setGithubIssueForm(prev=>({ ...prev, body: e.target.value }))} placeholder="Body (optional)" className="w-full bg-slate-800 border border-slate-700 rounded p-2 text-xs text-white" rows="3"></textarea>
                                                <button className="bg-purple-600 px-4 py-2 rounded font-bold text-xs w-full">CREATE ISSUE</button>
                                            </form>
                                        </div>

                                        <div className="bg-slate-900 rounded p-4 border border-slate-700 md:col-span-2">
                                            <div className="font-bold text-sm">Render: Trigger Deploy</div>
                                            <form onSubmit={triggerRenderDeploy} className="mt-3 flex flex-col md:flex-row gap-2">
                                                <select value={renderDeployForm.connection_id} onChange={e=>setRenderDeployForm({ connection_id: e.target.value })} className="flex-1 bg-slate-800 border border-slate-700 rounded px-2 py-2 text-xs text-white">
                                                    <option value="">Select Render connection...</option>
                                                    {connections.filter(x=>x.type==='render').map(x => (
                                                        <option key={x.id} value={x.id}>{x.name || x.id}</option>
                                                    ))}
                                                </select>
                                                <button className="bg-amber-600 px-4 py-2 rounded font-bold text-xs">TRIGGER DEPLOY</button>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                        {tab === 'IDE' && <iframe src="http://localhost:8443"></iframe>}
                    </div>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
