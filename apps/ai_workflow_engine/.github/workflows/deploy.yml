name: Deploy AI Workflow Engine
on:
  push:
    paths: ['apps/ai_workflow_engine/**']
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - development
      version:
        description: 'Version tag'
        required: false
        default: 'latest'
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ai-workflow-engine

jobs:
  test:
    name: Test and Validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          cd apps/ai_workflow_engine
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio
      
      - name: Run tests
        run: |
          cd apps/ai_workflow_engine
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=html
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: apps/ai_workflow_engine/coverage.xml
          flags: unittests
          name: codecov-umbrella
      
      - name: Run security scan
        run: |
          cd apps/ai_workflow_engine
          pip install bandit
          bandit -r . -f json -o bandit-report.json || true
      
      - name: Run code quality checks
        run: |
          cd apps/ai_workflow_engine
          pip install flake8 black isort mypy
          black --check .
          isort --check-only .
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          mypy --ignore-missing-imports . || true

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
      
      - name: Run dependency vulnerability scan
        run: |
          cd apps/ai_workflow_engine
          pip install safety
          safety check --json --output safety-report.json || true
      
      - name: Run Snyk security scan
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, security]
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.tags }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.event.inputs.version || 'latest' }}
      
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./apps/ai_workflow_engine
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            VERSION=${{ github.event.inputs.version || 'latest' }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
      
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.meta.outputs.tags }}
          format: spdx-json
          output-file: sbom.spdx.json
      
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v3
        with:
          name: sbom
          path: sbom.spdx.json

  deploy-render:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment: ${{ github.event.inputs.environment || 'production' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to Render
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d '{
              "serviceId": "${{ secrets.RENDER_SERVICE_ID }}",
              "imageUrl": "${{ needs.build.outputs.image-tag }}",
              "envVars": [
                {"key": "IMAGE_DIGEST", "value": "${{ needs.build.outputs.image-digest }}"},
                {"key": "COMMIT_SHA", "value": "${{ github.sha }}"},
                {"key": "BUILD_DATE", "value": "${{ github.event.head_commit.timestamp }}"}
              ]
            }' \
            https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys
      
      - name: Wait for deployment
        run: |
          echo "Waiting for Render deployment to complete..."
          sleep 60
      
      - name: Verify deployment
        run: |
          curl -f https://${{ secrets.RENDER_SERVICE_URL }}/health || exit 1
          echo "Deployment verified successfully"

  deploy-cloudflare:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install Wrangler
        run: npm install -g wrangler
      
      - name: Deploy to Cloudflare Workers
        run: |
          cd apps/ai_workflow_engine
          echo "${{ secrets.CLOUDFLARE_API_TOKEN }}" | wrangler auth
          wrangler deploy --env ${{ github.event.inputs.environment || 'production' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  update-github-status:
    name: Update GitHub Status
    runs-on: ubuntu-latest
    needs: [deploy-render, deploy-cloudflare]
    if: always() && (needs.deploy-render.result == 'success' || needs.deploy-cloudflare.result == 'success')
    
    steps:
      - name: Update deployment status
        uses: actions/github-script@v7
        with:
          script: |
            const { data: commit } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha
            });
            
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              target_url: 'https://${{ secrets.RENDER_SERVICE_URL }}',
              description: 'AI Workflow Engine deployed successfully',
              context: 'deployment/ai-workflow-engine'
            });

  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [deploy-render, deploy-cloudflare]
    if: always() && (github.ref == 'refs/heads/main')
    
    steps:
      - name: Send Slack notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      
      - name: Send Discord notification
        uses: appleboy/discord-action@v1
        with:
          webhook_id: ${{ secrets.DISCORD_WEBHOOK_ID }}
          webhook_token: ${{ secrets.DISCORD_WEBHOOK_TOKEN }}
          message: |
            🚀 **AI Workflow Engine Deployment**
            
            **Status:** ${{ job.status }}
            **Environment:** ${{ github.event.inputs.environment || 'production' }}
            **Version:** ${{ needs.build.outputs.image-tag }}
            **Commit:** ${{ github.sha }}
            
            **Changes:** ${{ github.event.head_commit.message }}
            
            **View:** https://${{ secrets.RENDER_SERVICE_URL }}
            **Monitor:** https://${{ secrets.GRAFANA_URL }}

  cleanup:
    name: Cleanup Old Resources
    runs-on: ubuntu-latest
    needs: [deploy-render, deploy-cloudflare]
    if: always() && github.ref == 'refs/heads/main'
    
    steps:
      - name: Cleanup old Docker images
        run: |
          # Keep only last 10 images
          echo "Cleaning up old Docker images..."
          # This would be implemented based on your registry cleanup strategy
      
      - name: Cleanup old workflow executions
        run: |
          echo "Cleaning up old workflow executions..."
          # This would cleanup old executions from the database
